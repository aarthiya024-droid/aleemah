<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - InternMatch</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        Intern<span>Match</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="profile.html" class="active">My Profile</a>
        <a href="internships.html">Internships</a>
        <a href="saved.html">Saved</a>
        <a href="skill-gap.html">Skill Gap</a>
    </nav>

</header>

<main class="container">

    <div class="page-header">
        <h1>Build Your Profile</h1>
        <p>
            Tell us about yourself so we can find better internship matches.
        </p>
    </div>

    <form id="profileForm" class="profile-form">

        <section class="form-section">

            <h2>Personal Information</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label>Full Name *</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="student@example.com"
                    >
                </div>

            </div>

        </section>

        <section class="form-section">

            <h2>Education</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label>Degree *</label>

                    <select id="degree" required>
                        <option value="">Select degree</option>
                        <option>Computer Science</option>
                        <option>Information Technology</option>
                        <option>Data Science</option>
                        <option>Artificial Intelligence</option>
                        <option>Electronics</option>
                        <option>Mechanical Engineering</option>
                        <option>Business Administration</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Specialization</label>

                    <input
                        type="text"
                        id="specialization"
                        placeholder="e.g. Web Development"
                    >
                </div>

                <div class="form-group">
                    <label>College / University</label>

                    <input
                        type="text"
                        id="college"
                        placeholder="College name"
                    >
                </div>

                <div class="form-group">
                    <label>Graduation Year</label>

                    <select id="graduationYear">
                        <option>2026</option>
                        <option>2027</option>
                        <option>2028</option>
                        <option>2029</option>
                    </select>
                </div>

            </div>

        </section>

        <section class="form-section">

            <h2>Skills</h2>

            <div class="form-group">

                <label>
                    Technical Skills
                </label>

                <input
                    type="text"
                    id="technicalSkills"
                    placeholder="Python, SQL, Git, Docker"
                >

                <small>
                    Separate skills using commas.
                </small>

            </div>

            <div class="form-group">

                <label>
                    Programming Languages
                </label>

                <input
                    type="text"
                    id="programmingLanguages"
                    placeholder="JavaScript, Python, Java"
                >

            </div>

            <div class="form-group">

                <label>
                    Frameworks & Tools
                </label>

                <input
                    type="text"
                    id="frameworks"
                    placeholder="React, Node.js, Git, Firebase"
                >

            </div>

            <div class="form-group">

                <label>
                    Soft Skills
                </label>

                <input
                    type="text"
                    id="softSkills"
                    placeholder="Communication, Leadership, Teamwork"
                >

            </div>

        </section>

        <section class="form-section">

            <h2>Projects & Experience</h2>

            <div class="form-group">

                <label>Projects</label>

                <textarea
                    id="projects"
                    placeholder="Describe your projects..."
                ></textarea>

            </div>

            <div class="form-group">

                <label>Previous Experience</label>

                <textarea
                    id="experience"
                    placeholder="Describe internships or previous experience..."
                ></textarea>

            </div>

            <div class="form-group">

                <label>Certifications</label>

                <input
                    type="text"
                    id="certifications"
                    placeholder="AWS, Google Cloud, Python certification"
                >

            </div>

        </section>

        <section class="form-section">

            <h2>Internship Preferences</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>Preferred Domain *</label>

                    <select id="domain" required>

                        <option value="">
                            Select domain
                        </option>

                        <option>Web Development</option>
                        <option>Software Development</option>
                        <option>Data Science</option>
                        <option>Artificial Intelligence</option>
                        <option>Machine Learning</option>
                        <option>Cybersecurity</option>
                        <option>Cloud Computing</option>
                        <option>DevOps</option>
                        <option>Mobile Development</option>
                        <option>UI/UX</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Preferred Location</label>

                    <select id="location">

                        <option value="Any">Any</option>
                        <option>Chennai</option>
                        <option>Bangalore</option>
                        <option>Hyderabad</option>
                        <option>Mumbai</option>
                        <option>Delhi</option>
                        <option>Remote</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Work Mode</label>

                    <select id="workMode">

                        <option>Any</option>
                        <option>Remote</option>
                        <option>Hybrid</option>
                        <option>On-site</option>

                    </select>

                </div>

            </div>

        </section>

        <button type="submit" class="btn primary save-profile">
            Save Profile & Find Matches
        </button>

        <div id="profileMessage"></div>

    </form>

</main>

<script src="js/storage.js"></script>
<script src="js/profile.js"></script>

</body>
</html>
